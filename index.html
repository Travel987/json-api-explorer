<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON API Explorer</title>
</head>
<body>

  <h1>JSON API Explorer</h1>

  <!-- CREATE POST -->
  <section>
    <h2>Create New Post</h2>

    <form id="postForm">
      <div>
        <label>Title:</label>
        <input type="text" id="title" required>
      </div>

      <div>
        <label>Body:</label>
        <textarea id="body" rows="4" required></textarea>
      </div>

      <button type="submit">Submit Post</button>
    </form>

    <p id="message"></p>
  </section>

  <!-- POSTS -->
  <section>
    <h2>Posts</h2>

    <button id="fetchButton">Fetch Posts</button>

    <div id="error"></div>
    <div id="postList"></div>
  </section>

  <script src="script.js"></script>

</body>
</html>
